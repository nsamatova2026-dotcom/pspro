# Worker nomi Cloudflare panelidagi Worker nomi bilan bir xil bo'lishi kerak
name = "pspro"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# public/ dagi sahifa va fayllar; /api/* so'rovlarini src/worker.js qayta ishlaydi
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Barcha AI funksiyalari Google Gemini orqali ishlaydi. Kalit: Cloudflare panelida GEMINI_API_KEY maxfiy o'zgaruvchisi.
# Matnli suhbat modeli (topilmasa yoki band bo'lsa, gemini-flash-lite-latest, gemini-2.5-flash va boshqalar avtomatik sinaladi)
GEMINI_MODEL = "gemini-flash-latest"
# Ovozli suhbat modeli: audio tahlili uchun tez «lite» modeli
GEMINI_VOICE_MODEL = "gemini-flash-lite-latest"
# Javoblarni o'qiydigan ovoz modeli va ovoz nomi
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
GEMINI_TTS_VOICE = "Kore"
# Bitta javobni kutish chegarasi (millisekund)
GEMINI_TIMEOUT_MS = "30000"
# Kunlik AI so'rovlari: har bir respondentga va bitta IP manzilga (auditoriya bitta IP orqali chiqishi mumkin)
AI_DAILY_LIMIT = "60"
AI_DAILY_LIMIT_IP = "1500"

# D1 ma'lumotlar bazasi: database_id ko'rsatilmagan, shuning uchun birinchi deploy'da avtomatik yaratiladi.
# Jadvallarni server birinchi so'rovda o'zi yaratadi.
[[d1_databases]]
binding = "DB"
database_name = "ruhai-db"
