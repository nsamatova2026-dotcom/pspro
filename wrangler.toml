# Worker nomi Cloudflare panelidagi Worker nomi bilan bir xil bo'lishi kerak
name = "pspro"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# public/ dagi sahifa va fayllar; /api/* so'rovlarini src/worker.js qayta ishlaydi
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# AI provayderi: "workers-ai" (bepul, kalitsiz), "gemini" (bepul tarif, GEMINI_API_KEY),
# "anthropic" (pullik, ANTHROPIC_API_KEY). Bo'sh qoldirilsa, mavjud kalitga qarab tanlanadi.
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/google/gemma-3-12b-it"
GEMINI_MODEL = "gemini-2.5-flash"
ANTHROPIC_MODEL = "claude-opus-5-5"
AI_DAILY_LIMIT = "50"

# Cloudflare Workers AI — bepul kunlik limit bilan, alohida kalit talab qilmaydi
[ai]
binding = "AI"

# D1 ma'lumotlar bazasi: database_id ko'rsatilmagan, shuning uchun birinchi deploy'da avtomatik yaratiladi.
# Jadvallarni server birinchi so'rovda o'zi yaratadi.
[[d1_databases]]
binding = "DB"
database_name = "ruhai-db"
